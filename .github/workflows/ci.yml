name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # A real MongoDB, so the account tests also run against an actual database.
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGODB_TEST_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v7
      # Test on the same Python version the Docker image (production) uses, read
      # from the Dockerfile, so a base-image bump is tested in its own pull request.
      - name: Read the Python version from the Dockerfile
        id: python
        run: |
          version=$(sed -nE 's/^FROM python:([0-9]+\.[0-9]+).*/\1/p' Dockerfile | head -n 1)
          if [ -z "$version" ]; then
            echo "::error file=Dockerfile::Couldn't read the Python version from the FROM line"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Testing on Python $version (from Dockerfile)"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.python.outputs.version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q tests

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t examforge .
      - name: Start the container and wait for the health check
        run: |
          docker run -d --name examforge -p 8501:8501 examforge
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health; then exit 0; fi
            sleep 2
          done
          docker logs examforge
          exit 1
